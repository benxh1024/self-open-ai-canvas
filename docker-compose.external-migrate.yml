# 外部 PostgreSQL 的显式迁移任务。
# 主应用 docker-compose.external-services.yml 不包含 migrate，避免普通 up 误触发数据库变更。
services:
  # Used by Host Updater for external PostgreSQL backup and restore. It runs
  # only when explicitly targeted; normal application startup never starts it.
  db-tools:
    profiles: ["maintenance"]
    image: postgres:17-alpine
    environment:
      DATABASE_URL: ${DATABASE_URL:?请先配置外部 PostgreSQL 的 DATABASE_URL}
    networks:
      - db-common-network
      - open-ai-network

  migrate:
    profiles: ["migration"]
    image: ${CANVAS_BACKEND_IMAGE:?请先配置 CANVAS_BACKEND_IMAGE}
    entrypoint: ["migrate-schema"]
    command: ["up"]
    environment:
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_DATABASE_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL:?请先配置外部 PostgreSQL 的 DATABASE_URL}
    networks:
      - db-common-network
      - open-ai-network

networks:
  db-common-network:
    external: true

  open-ai-network:
    driver: bridge
